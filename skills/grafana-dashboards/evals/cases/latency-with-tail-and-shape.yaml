behavior: latency-with-tail-and-shape
prompt: |
  Improve the commit latency view in dashboard.json and write the result back.
setup: |
  cat > dashboard.json <<'EOF'
  {
    "uid": "consumer",
    "title": "Consumer",
    "panels": [
      {"id": 1, "type": "timeseries", "title": "Commit duration p95",
       "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
       "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(kafka_consumer_commit_duration_ms_bucket[$__rate_interval])))"}]}
    ]
  }
  EOF
checks:
  - shell: |
      python3 - <<'EOF'
      import json, re
      panels = json.load(open("dashboard.json"))["panels"]
      exprs = " ".join(t.get("expr", "") for p in panels for t in p.get("targets", []))
      for q in ("0.5", "0.95", "0.99", "1"):
          assert re.search(r"histogram_quantile\(\s*" + re.escape(q) + r"\s*,", exprs), q
      assert any(p["type"] == "heatmap" for p in panels), "no heatmap panel"
      EOF
  - judge: >
      One panel shows p50, p95, p99, and max of commit duration with max drawn dashed, and a
      heatmap of the same histogram sits beside it on the same line at the same height.
timeout: 300
